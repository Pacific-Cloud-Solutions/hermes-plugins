name: pcs-security-guard
description: The PCS security suite for Hermes Agent — read-only, local, advisory host auditing. One job per plugin, evidence-first findings that cite file and line, and coverage that names what could not be checked. Pick the tools you want; nothing here changes your system.
version: 0.1.0
author: Pacific Cloud Solutions
homepage: https://github.com/Pacific-Cloud-Solutions/hermes-plugins

# Every entry pins a FULL 40-character commit SHA. Branches and short SHAs are
# rejected. Repin each entry in the same commit that changes the plugin.
plugins:
  - repo: Pacific-Cloud-Solutions/hermes-plugins
    subdir: plugins/pcs-security-core
    ref: 882800fcb2f4169a06181d9939fd727d2a72e52d
  - repo: Pacific-Cloud-Solutions/hermes-plugins
    subdir: plugins/pcs-security-tls-posture
    ref: 882800fcb2f4169a06181d9939fd727d2a72e52d
  - repo: Pacific-Cloud-Solutions/hermes-plugins
    subdir: plugins/pcs-security-log-triage
    ref: 882800fcb2f4169a06181d9939fd727d2a72e52d
  - repo: Pacific-Cloud-Solutions/hermes-plugins
    subdir: plugins/pcs-security-network-exposure
    ref: 882800fcb2f4169a06181d9939fd727d2a72e52d
  - repo: Pacific-Cloud-Solutions/hermes-plugins
    subdir: plugins/pcs-security-web-headers
    ref: 882800fcb2f4169a06181d9939fd727d2a72e52d

# pcs-security-auth-posture is deliberately NOT listed yet.
#
# It audits authentication posture, so its source necessarily names the artifacts it
# inspects — key files, the account database, and NOPASSWD entries. The install
# scanner is lexical and treats those same strings as hostile, so the plugin scans
# `dangerous`, and `--force` does not override a dangerous verdict.
#
# A pack install runs the install scanner for every plugin it contains, so listing
# it here would fail the ENTIRE pack for everyone — including users who only wanted
# the other five. It goes in once the declared-read-only-audit-intent signal lands
# upstream and the plugin scans `safe` on a released Hermes.