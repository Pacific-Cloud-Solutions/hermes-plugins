name: pcs-security-guard
description: The PCS security suite for Hermes Agent — read-only, local, advisory host auditing, one job per plugin, pinned to exact commit SHAs.
version: 0.1.0
author: Pacific Cloud Solutions
plugins: []
# Each entry is `repo:` + `subdir:` + `ref:` (a full 40-character commit SHA — branches and
# short SHAs are rejected). Add one per published plugin, and repin it in the same commit that
# changes the plugin:
#
# plugins:
#   - repo: Pacific-Cloud-Solutions/hermes-plugins
#     subdir: plugins/<id>
#     ref: <40-char-sha>