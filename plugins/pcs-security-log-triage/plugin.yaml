name: pcs-security-log-triage
version: 0.3.0
description: Read-only triage of local logs — correlated authentication anomalies, password sprays, account lifecycle events, service crashes, and logs that have gone silent
author: Pacific Cloud Solutions
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/Pacific-Cloud-Solutions/hermes-plugins
tags:
  - security
  - triage
  - readonly
  - logs

# No `audit:` declaration here, deliberately. This plugin never names an artifact
# that the install scanner treats as hostile vocabulary — it reads log files and
# reports on them.

# This plugin BUNDLES the shared contract in `_contract/` (byte-identical copies of
# pcs-security-core's four modules, refreshed by scripts/vendor_contract.py and guarded by
# a drift test). It therefore declares NO `requires_plugins`: a catalog entry installs
# exactly one plugin, so a plugin that needed a sibling would install onto a host that has
# none and fail at first use. The bundle is loaded only when the shared pcs-security-core
# plugin is absent; when it is present, core stays authoritative and owns the host-level
# registrations (see __init__.py).
#
# The contract is imported lazily, on first tool use: `hermes plugins doctor` and
# `hermes plugins validate` run a plugin in ISOLATION, and `_contract/` travels with the
# plugin, so both gates exercise the bundled copy.

provides_tools:
  - log_triage
provides_hooks: []