name: pcs-security-auth-posture
version: 0.1.0
description: Read-only audit of local authentication posture — SSH config, sudoers, authorized keys, UID 0 accounts
author: Pacific Cloud Solutions
license: MIT
manifest_version: 2
api_version: 1
homepage: https://github.com/Pacific-Cloud-Solutions/hermes-plugins
tags:
  - security
  - hardening
  - readonly

# Declared read-only audit intent.
#
# This plugin NAMES the artifacts it audits and never acts on them: each path below
# is read, reported and cited, and no finding is ever written back. Declaring them
# lets the install scanner tell a reference from an attack — it can only LOWER a
# finding's severity, only for these targets, never when the file mutates the
# target, and never on a line that acts on it.
audit:
  readonly: true
  targets:
    - authorized_keys
    - "/etc/passwd"
    - "/etc/shadow"
    - NOPASSWD
    - sshd_config
    - sudoers
    - sudo
    - ".ssh/"

# pcs-security-core is imported lazily, on first tool use. Without it the tool still
# REGISTERS but REFUSES TO RUN — no report is ever produced outside the taint
# model. It is deliberately not imported at module scope, because `hermes plugins
# doctor` and `hermes plugins validate` run a plugin in ISOLATION, where no
# sibling directory exists. See bootstrap.py and README.md.
requires_plugins:
  - id: pcs-security-core
    version_range: ">=0.1.0"

provides_tools:
  - auth_posture
provides_hooks: []